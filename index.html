</style></head><body><header><h1>Kassenbelege</h1><small>Malermeister Ficker · Offline-Belegarchiv</small></header><main><section><button onclick="camera.click()">📷 Beleg fotografieren</button> <button class="alt" onclick="gallery.click()">Foto importieren</button><input hidden type="file" id="camera" accept="image/*" capture="environment"><input hidden type="file" id="gallery" accept="image/*"><div id="editor" hidden><div class="preview"><img id="preview"></div><button class="alt" onclick="transform('rotate')">↻ Drehen</button> <button class="alt" onclick="transform('gray')">Schwarz-Weiß</button> <button class="alt" onclick="resetImage()">Original</button><div class="grid"><label>Datum<input id="date" type="date"></label><label>Betrag (€)<input id="amount" inputmode="decimal" placeholder="0,00"></label></div><label>Händler<input id="merchant"></label><label>Baustelle / Bemerkung<input id="project"></label><button onclick="save(false)">Speichern</button> <button onclick="save(true)">Speichern & PDF öffnen</button></div></section><section><label>Monat (leer = alle)<input type="month" id="month"></label><strong id="total"></strong><br><button onclick="printSelected()">Auswahl als PDF öffnen</button> <button class="alt" onclick="selectAll()">Alle auswählen</button><div id="list"></div></section><section><button class="alt" onclick="backup()">Datensicherung exportieren</button> <button class="alt" onclick="restoreFile.click()">Importieren</button><input hidden type="file" id="restoreFile" accept=".json,application/json"><p><small>Belege bleiben auf diesem Gerät. Regelmäßig sichern. Kein revisionssicheres Buchhaltungsarchiv.</small></p></section><p id="status" role="status"></p></main><div id="print"></div><dialog id="pdfDialog" style="width:95%;max-width:720px;border:0;border-radius:12px;padding:14px"><h2>PDF-Beleg</h2><p>Die PDF-Datei ist fertig. Öffnen, teilen oder speichern.</p><a id="pdfLink" class="pick" target="_blank" rel="noopener">PDF öffnen</a> <button id="pdf const $=id=>document.getElementById(id);let db,original='',current='',rows=[],selected=new Set();const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('date').value=today();$('month').value=today().slice(0,7);const status=s=>$('status').textContent=s;const req=indexedDB.open('ficker-belege',1);req.onupgradeneeded=()=>req.result.createObjectStore('receipts',{keyPath:'id'});req.onsuccess=()=>{db=req.result;load()};req.onerror=()=>status('Lokaler Speicher nicht verfügbar.');function store(mode='readonly'){return db.transaction('receipts',mode).objectStore('receipts')}function write(r){return new Promise((resolve,reject)=>{let t=db.transaction('receipts','readwrite');t.objectStore('receipts').put(r);t.oncomplete=resolve;t.onerror=reject})}function load(){let r=store().getAll();r.onsuccess=()=>{rows=r.result.sort((a,b)=>b.date.localeCompare(a.date));render()}}function readFile(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}async function capture(e){try{if(!e.target.files[0])return;original=current=await readFile(e.target.files[0]);$('preview').src=current;$('editor').hidden=false;$('date').value=today();['amount','merchant','project'].forEach(k=>$(k).value='');e.target.value=''}catch{status('Foto konnte nicht geöffnet werden.')}}$('camera').onchange=$('gallery').onchange=capture;function resetImage(){current=original;$('preview').src=current}async function transform(kind){let im=new Image();im.src=current;await im.decode();let c=document.createElement('canvas'),w=im.width,h=im.height;c.width=kind==='rotate'?h:w;c.height=kind==='rotate'?w:h;let x=c.getContext('2d');if(kind==='rotate'){x.translate(h,0);x.rotate(Math.PI/2)}x.drawImage(im,0,0);if(kind==='gray'){let d=x.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){let v=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];d.data[i]=d.data[i+1]=d.data[i+2]=v}x.putImageData(d,0,0)}current=c.toDataURL('image/jpeg',.94);$('preview').src=current}async function save(p){if(!current||!db)return;let a=$('amount').value.trim().replace(',','.');if(a&&!/^\d+(\.\d{1,2})?$/.test(a)){alert('Bitte gültigen Betrag eingeben.');return}let r={id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),date:$('date').value||today(),amount:a===''?null:Number(a),merchant:$('merchant').value,project:$('project').value,image:current,original};try{await write(r);$('editor').hidden=true;current='';$('month').value=r.date.slice(0,7);load();status('Beleg gespeichert.');if(p)pdfRows([r])}catch{status('Speichern fehlgeschlagen.')}}function filtered(){return rows.filter(r=>!$('month').value||r.date.startsWith($('month').value))}const money=n=>n==null?'–':n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});function el(tag,txt){let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;return e}function render(){let l=$('list');l.replaceChildren();let f=filtered();$('total').textContent=`${f.length} Belege · ${money(f.reduce((s,r)=>s+(r.amount||0),0))}`;for(let r of f){let a=el('article'),ck=el('input');ck.type='checkbox';ck.style.width='22px';ck.checked=selected.has(r.id);ck.onchange=()=>ck.checked?selected.add(r.id):selected.delete(r.id);let im=el('img');im.src=r.image;let d=el('div');d.append(el('strong',r.merchant||'Kassenbeleg'),el('p',r.date+' · '+money(r.amount)),el('small',r.project));let p=el('button','PDF öffnen');p.onclick=()=>pdfRows([r]);let del=el('button','Löschen');del.className='alt';del.onclick=()=>{if(confirm('Beleg wirklich löschen?')){let q=store('readwrite').delete(r.id);q.onsuccess=()=>{selected.delete(r.id);load()}}};d.append(el('br'),p,document.createTextNode(' '),del);a.append(ck,im,d);l.append(a)}}$('month').onchange=()=>{selected.clear();render()};function selectAll(){filtered().forEach(r=>selected.add(r.id));render()}function printSelected(){let f=filtered().filter(r=>selected.has(r.id));if(!f.length)return alert('Bitte Belege auswählen.');pdfRows(f)}async function printRows(f){let root=$('print');root.replaceChildren();for(let r of f){let s=el('div');s.className='sheet';s.append(el('h2','Malermeister Ficker – Kassenbeleg'),el('p',[r.date,r.merchant,money(r.amount),r.project].filter(Boolean).join(' · ')));let im=el('img');im.src=r.image;s.append(im);root.append(s)}await Promise.all([...root.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));window.print()}

status('PDF wird erstellt …');let enc=new TextEncoder(),parts=[],offsets=[0],length=0;function add(v){let b=typeof v==='string'?enc.encode(v):v;parts.push(b);length+=b.length}function obj(n,v){offsets[n]=length;add(n+' 0 obj\n');add(v);add('\nendobj\n')}function stream(n,dict,b){offsets[n]=length;add(n+' 0 obj\n<< '+dict+' /Length '+b.length+' >>\nstream\n');add(b);add('\nendstream\nendobj\n')}

let start=length;add('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');for(let i=1;i<offsets.length;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF\n');pdfFile=new File(parts,'Kassenbelege-'+(f.length===1?f[0].date:today())+'.pdf',{type:'application/pdf'});if(pdfURL)URL.revokeObjectURL(pdfURL);pdfURL=URL.createObjectURL(pdfFile);$('pdfLink').href=pdfURL;$('pdfShare').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[pdfFile]}))await navigator.share({files:[pdfFile]});else{let a=el('a');a.href=pdfURL;a.download=pdfFile.name;a.click()}}catch(e){if(e.name!=='AbortError')alert('Bitte PDF öffnen und dort teilen.')}};$('pdfPrint').onclick=()=>printRows(f);$('pdfDialog').showModal();status('PDF erstellt.');}catch(e){status('PDF konnte nicht erstellt werden: '+e.message)}}
function backup(){let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,receipts:rows})],{type:'application/json'}));a.download='Kassenbelege-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}$('restoreFile').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.receipts)||!data.receipts.every(r=>typeof r.id==='string'&&typeof r.date==='string'&&/^data:image\//.test(r.image)&&typeof r.merchant==='string'&&typeof r.project==='string'&&(r.amount===null||typeof r.amount==='number')))throw Error();for(let r of data.receipts)await write(r);load();status('Datensicherung importiert.')}catch{status('Import fehlgeschlagen.')}e.target.value=''};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>status('Offline-Installation benötigt HTTPS.'));
